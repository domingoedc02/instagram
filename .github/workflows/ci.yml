# Merge gates (spec/operations, CI/CD pipeline; spec/testing, Definition of Done).
# Every job is a required status check on main — see docs/ci.md.
name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

# A new push to a PR cancels its superseded run; runs on main/staging always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  setup-and-static:
    name: Lint, typecheck, format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-static-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-static-${{ runner.os }}-
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test

  integration:
    name: Integration tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The same images, tmpfs test database and bucket setup as `pnpm infra:up` locally.
      - name: Start Postgres, Redis and MinIO
        run: |
          infra/scripts/compose.sh up -d --wait --wait-timeout 90 postgres-test redis minio
          infra/scripts/compose.sh run --rm minio-init
      - run: pnpm turbo run test:int --filter=@ins/db
      # Unit + integration suites in one run; fails below the spec/testing thresholds.
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-web
          path: apps/web/coverage/
          retention-days: 14
      - name: Service logs
        if: failure()
        run: infra/scripts/compose.sh logs --tail=200

  migration-drift:
    name: Migration drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: infra/scripts/compose.sh up -d --wait --wait-timeout 90 postgres-test
      # Replays migrations into the shadow DB and diffs against schema.prisma; exit 2 = drift.
      - name: Fail if schema.prisma changed without a migration
        run: pnpm db:drift

  security:
    name: Secret scan + dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks-action lists the PR's commits to scan only what the PR adds.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
      - uses: ./.github/actions/setup
      - run: pnpm audit --prod --audit-level high

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: turbo-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-build-${{ runner.os }}-
      # The build must not depend on runtime secrets (src/lib/env.ts skips validation here).
      - name: Build without runtime env
        run: rm .env && pnpm build
