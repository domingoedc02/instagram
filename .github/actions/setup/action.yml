name: Setup
description: pnpm + Node (from .nvmrc) with the pnpm store cached, then a frozen install and the CI env.
runs:
  using: composite
  steps:
    # Reads the version from package.json "packageManager".
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    # Package scripts load the root .env (dotenv-cli); CI uses throwaway local values.
    - run: cp .github/ci.env .env
      shell: bash
